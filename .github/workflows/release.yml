# Releases flow through Changesets: pending changesets on main produce a "Version Packages" pull
# request, and merging it publishes to npm. npm trusted publishing is registered against exactly
# this repository, this file name and no GitHub environment; renaming the file or adding an
# `environment:` to the job breaks publication.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    if: github.repository == 'mike-north/sh-analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      # Node 24 is the publishing runtime; pin npm above the trusted-publishing minimum (11.5.1).
      - run: npm install --global npm@11.21.1
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          # The changelog generator reads pull request metadata with this token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
