# Every proposed change and main revision must preserve the owner's 0.x boundary.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Changesets status resolves its configured baseBranch even when inspecting the complete pending plan.
      - if: github.event_name == 'pull_request'
        run: git branch main origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:changesets
      - run: pnpm check:versions
      - run: pnpm build
      # Includes type-aware lint, the approved API report, Knip, and syncpack lint.
      - run: pnpm check
      - run: pnpm test
